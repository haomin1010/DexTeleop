# DexProj main bringup config.
# This repository currently supports HTC/OpenVR as the only arm teleop route.

mode: dual
enable_camera: true
enable_rviz: true

hand_input: wuji_glove
arm_input: tracker

# Match dual-arm native Tianji teleop path.
arm_controller_config: wuji-hand-teleop/src/output_devices/tianji_output/tianji_output/config/tianji_output_real_teleop_both.yaml
arm_dry_run: true
arm_read_only: false
arm_feedback_handshake: false
arm_sdk_executor_enable: true
arm_sim_viz: true
