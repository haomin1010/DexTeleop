global:
  startup_delay: 3.0
  enable_sync: false

cameras:
  head:
    enabled: true
    type: d435i
    serial_number: 401622073401
    video_device: /dev/stereo_camera
    pixel_format: mjpeg2rgb
    io_method: mmap
    resolution:
      width: 424
      height: 240
      fps: 30
    camera_name: cam_head
    streams:
      enable_color: true
      enable_depth: false
      align_depth: false
      enable_pointcloud: false
      enable_gyro: false
      enable_accel: false
    enable_auto_exposure: false
    exposure: 120
    gain: 16
    tf:
      parent_frame: base_link
      child_frame: cam_head_link
      translation: [0.0, 0.0, 0.5]
      rotation: [0.0, 0.3, 0.0]

  left_wrist:
    enabled: true
    type: d405
    serial_number: 260522279586
    initial_reset: true
    video_device: /dev/cam_left_wrist
    pixel_format: mjpeg2rgb
    io_method: mmap
    resolution:
      width: 424
      height: 240
      fps: 30
    camera_name: cam_left_wrist
    streams:
      enable_color: true
      enable_depth: false
      align_depth: false
      enable_pointcloud: false
      enable_gyro: false
      enable_accel: false
    enable_auto_exposure: true
    exposure: 120
    gain: 16
    tf:
      parent_frame: left_wrist_link
      child_frame: cam_left_wrist_link
      translation: [0.0, 0.0, 0.0]
      rotation: [0.0, 0.0, 0.0]

  right_wrist:
    enabled: true
    type: d405
    serial_number: 260422274470
    video_device: /dev/cam_right_wrist
    pixel_format: mjpeg2rgb
    io_method: mmap
    resolution:
      width: 424
      height: 240
      fps: 30
    camera_name: cam_right_wrist
    streams:
      enable_color: true
      enable_depth: false
      align_depth: false
      enable_pointcloud: false
      enable_gyro: false
      enable_accel: false
    enable_auto_exposure: true
    exposure: 120
    gain: 16
    tf:
      parent_frame: right_wrist_link
      child_frame: cam_right_wrist_link
      translation: [0.0, 0.0, 0.0]
      rotation: [0.0, 0.0, 0.0]
